<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouchaks OCSDN | Customer & Supplier Distribution Network</title>

<style>

:root{
  --blue:#164a8a;
  --blue-dark:#0d315d;
  --red:#c62828;
  --red-dark:#8e1d1d;
  --green:#16834a;
  --orange:#b26b00;
  --dark:#18202a;
  --muted:#687381;
  --background:#f4f6f8;
  --white:#ffffff;
  --border:#dfe4ea;
  --danger:#a51d2d;
  --shadow:0 8px 24px rgba(16,24,40,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--background);
  color:var(--dark);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   LOGIN
========================================================= */

.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;

  background:
    linear-gradient(
      135deg,
      rgba(13,49,93,.96),
      rgba(22,74,138,.94)
    ),
    url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1800&q=85");

  background-size:cover;
  background-position:center;
}

.login-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:22px;
  padding:32px;
  box-shadow:0 25px 80px rgba(0,0,0,.28);
}

.login-logo{
  width:64px;
  height:64px;
  border-radius:17px;
  display:grid;
  place-items:center;
  background:var(--red);
  color:white;
  font-size:30px;
  font-weight:900;
  margin-bottom:18px;
}

.login-card h1{
  margin:0 0 7px;
}

.login-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.login-field{
  margin:16px 0;
}

.login-field label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  font-weight:bold;
}

.login-field input{
  width:100%;
  padding:13px;
  border:1px solid #ccd4dd;
  border-radius:10px;
  outline:none;
}

.login-field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #164a8a18;
}

.login-message{
  min-height:18px;
  margin-top:12px;
  font-size:12px;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  background:linear-gradient(
    135deg,
    var(--blue),
    var(--blue-dark)
  );

  color:white;
  padding:14px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:46px;
  height:46px;
  background:white;
  color:var(--red);
  border-radius:12px;

  display:grid;
  place-items:center;

  font-weight:900;
  font-size:22px;
}

.brand h1{
  margin:0;
  font-size:18px;
}

.brand small{
  opacity:.8;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.user-role{
  background:#ffffff20;
  border:1px solid #ffffff30;
  padding:7px 10px;
  border-radius:8px;
}

/* =========================================================
   LAYOUT
========================================================= */

.container{
  max-width:1450px;
  margin:auto;
  padding:20px;
}

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:20px;
}

.sidebar{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  height:max-content;
  position:sticky;
  top:88px;
  box-shadow:var(--shadow);
}

.nav-group{
  font-size:11px;
  font-weight:bold;
  color:#8993a0;
  text-transform:uppercase;
  padding:15px 12px 5px;
}

.nav-btn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:11px 12px;
  border-radius:10px;
  margin:2px 0;
  color:#394554;
}

.nav-btn:hover,
.nav-btn.active{
  background:#eef4fb;
  color:var(--blue);
  font-weight:bold;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================================================
   HERO
========================================================= */

.hero{

  background:

      rgba(22,74,138,.72)
